<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Item1 {
            border: 1px solid black;
            width: 100px;
            height: 100px;
            background-color: yellow;
            visibility: visible;
        }

        .item2 {
            border: 1px solid black;
            width: 100px;
            height: 100px;
            background-color: red;
            visibility: hidden;
        }

        .item3 {
            border: 1px solid black;
            width: 100px;
            height: 100px;
            background-color: blue;
            visibility: collapse;
        }
    </style>
</head>

<body>
    <div class="Item1">Visible</div>
    <div class="item2">Hidden</div>
    <div class="item3">collapse</div>
</body>

</html>
