<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        :root {
            --primary-color: rgb(13, 225, 165);
            --secondary-color: #f0f0f0;
            --thridary-color: rgba(0, 0, 0, 0.2)
        }

        body {
            margin: 0;
            padding: auto;
            font-family: Arial, sans-serif;
            background-color: var(--secondary-color);
        }

        .section1 {
            margin: auto;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            ;
        }

        .BackgroundCard {
            margin-top: 30px;
            padding: 10px 10px 20px 10px;
            max-height: 230px;
            max-width: 3000px;
            background-color: var(--primary-color);
            border-radius: 20px;
            box-shadow: 0 4px 8px var(--thridary-color);
        }


        h4 {
            display: inline;
            font-size: 0.9em;


        }

        span {
            font-size: 0.9em;
            color: #333;

        }


        .ImageDiv {
            padding-bottom: 10px;
        }

        .BackgroundCard:hover {
            opacity: 0.5;
            transition: opacity 0.6s ease-in-out;
        }
    </style>
</head>

<body>
    <section class="section1">
        <div class="BackgroundCard">
            <div class="ImageDiv">
                <img src="./Web_Developement.png" alt="FullStackWebDevelopementImage" height="150px" width="100%;"
                    width="200px">
            </div>

            <div class="Paragrapgh">
                <h4>Course Name: </h4><span>PW Skills Web developement</span>

            </div>
        </div>


    </section>
</body>

</html>
