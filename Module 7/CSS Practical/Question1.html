<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --primary-color: #1b68cc;
            --secondary-color: #f0f0f0;
            ;
        }

        body {
            margin: auto;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: var(--secondary-color);
        }

        .navBar {
            width: 100%;
            height: 60px;
            padding: 0px;
            display: flex;
            justify-items: space-between;
            background-color: var(--primary-color)
        }

        .navBar ul {
            list-style-type: none;
            padding: 10px;
            justify-content: space-between;
            margin: 0;
            padding: 20px;



        }

        .navBar ul li {
            display: inline;
            padding: 30px;
            color: var(--secondary-color);
            margin: 0;



        }

        a {
            text-decoration: none;
            color: var(--secondary-color);
            border-bottom: 2px solid var(--secondary-color);
        }
    </style>
</head>

<body>
    <div class="navBar">
        <ul class="NavElements">
            <li class="mainElements"><a href="">Home </a></li>
            <li class="mainElements"><a href="">About Us</a></li>
            <li class="mainElements"><a href="">Contact</a></li>
            <li class="mainElements"><a href="">Blog</a></li>
            <li class="mainElements"><a href="">Login</a></li>
        </ul>
    </div>
</body>

</html>
