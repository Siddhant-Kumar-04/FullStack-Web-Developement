<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Circular Image Example</title>
    <style>
        body {
            text-align: center;
            margin-top: 50px;
            font-family: Arial, sans-serif;
        }

        .circular-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #555;
        }
    </style>
</head>

<body>

    <h2>My Circular Image</h2>
    <img src="./HumanImage.jpeg" alt="Sample" class="circular-image">

</body>

</html>
