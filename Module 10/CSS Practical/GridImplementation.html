<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            outline: 1px solid red;
        }

        .gridContainer {
            height: 500px;
            align-content: center;
            justify-content: space-evenly;
            display: grid;
            border: 2px solid black;
            padding: 1px;
            border-radius: 5px;
            align-items: center;
            justify-items: center;
            /* grid-template-columns: 100px 100px;
            grid-template-rows: 50px 50px 50px 50px; */
            grid: 50px 50px 50px 50px/100px 100px;
            /* grid property is used to combine both columns and row */
            /* grid-template-columns: 50% 50%; */
            /* grid-auto-flow: row; */

            /* grid-template-columns: repeat(4, 1fr); */
            /* grid-template-columns: repeat(4, 100px); */
            /* grid-template-columns: repeat(2, 1fr) 2fr 1fr; */
            /* grid-template-columns: 100px 500px 100px; */
            /* grid-template-areas: " a1 a1 a3" " a1 a1 b3" " c1 c1 c3"; */

            /* grid-auto-flow: column; */
            /* grid-template-rows: 50px 50px 50px; */

        }



        .item {

            background-color: aqua;
            border: 1px solid black;
            margin: 2px;
            padding: 10px;
            height: 50px;
            width: 50px;



        }

        /* .a1 {
            grid-area: a1;
            background-color: red;

        } */

        /* .c1 {
            grid-area: c1;
            background-color: yellow;
        } */
    </style>
</head>

<body>
    <h1>Introduction to grids</h1>
    <div class="gridContainer">
        <div class="item a1">1</div>
        <div class="item a1">2</div>
        <div class="item">3</div>
        <div class="item a1">4</div>
        <div class="item a1">5</div>
        <div class="item ">6</div>
        <div class="item c1">7</div>
        <div class="item c1">8</div>

    </div>
</body>

</html>
