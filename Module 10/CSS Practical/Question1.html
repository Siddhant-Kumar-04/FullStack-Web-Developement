<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {

            /* box-sizing: border-box; */
            margin: 0px;
            padding: 0px;
            /* outline: 1px solid red; */
        }


        body {
            /* height: 100vh; */
            /* width: 100vw; */
        }

        .mainContainer {
            height: 100%;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;

            grid-template-rows: 1fr 1fr 1fr;


        }

        .imageItem {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* display: block; */

        }

        .im1 {
            grid-column: 1/span 2;
            grid-row: 1;
            /* grid-row: 1/2; */
        }

        .im2 {
            grid-column: 3;
            grid-row: 1;
        }

        .im3 {
            grid-row: 2/span 2;
        }

        .im4 {
            grid-column: 2;
            grid-row: 2;
        }

        .im6 {
            grid-column: 2;
            grid-row: 3;
        }

        .im5 {
            grid-row: 2/4;
            grid-column: 3;
        }
    </style>
</head>

<body>
    <div class="mainContainer">
        <img src="./Image1_Painting.jpg" class="imageItem im1" alt="">
        <img src="./Image2_Painting.jpg" class="imageItem im2" alt="">
        <img src="./Image3_Painting.jpg" class="imageItem im3" alt="">
        <img src="./Image4_Painting.jpg" class="imageItem im4" alt="">
        <img src="./Image6_Painting.jpg" class="imageItem im5" alt="">
        <img src="./Image5_Painting.jpg" class="imageItem im6" alt="">
    </div>
</body>

</html>
