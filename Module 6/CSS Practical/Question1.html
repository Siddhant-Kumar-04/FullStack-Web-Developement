<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="ExternalCSS.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #InternalCSS {
            background-color: blue;
            margin: auto;
            height: 100px;
            width: 100px;
            padding: auto;
            border: 2px solid black;
        }

        h1 {
            /*Here We Have Done Experiment of Internal External and Inline CSS on a Single Element*/
            border: 1px solid black;
            background-color: blue;
            text-decoration: dashed;
            text-align: center;
            width: 100vw;
            height: 5vh;
        }
    </style>
</head>

<body>
    <h1
        style="border:1px solid black; background-color: red; text-decoration: dashed; text-align: center; width:100vw; height: 5vh;">
        This is
        Demo of Inline , Internal, External CSS Rules
    </h1>
    <!--Here We Have Done Experiment of Internal External and Inline CSS on a Single Element -->

    <div id="InlineCSS"
        style="background-color:red; width: 100px; height: 100px; margin:auto; padding:auto;  border: 2px solid black; text-align: center;">
        This is Div 1 <!--Here We Have Used Inline CSS-->
    </div>

    <div id="InternalCSS"> <!--Here We Have Used Internal CSS-->
        This is Div 2
    </div>

    <div id="ExternalCSS"> <!--Here We Have Used External CSS-->
        This is Div 3
    </div>
</body>

</html>
