<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            /* outline: 1px solid red; */
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: white;
            color: #333;
            margin: 0px;
            padding: 0px;


        }



        .main {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100%;
            width: 100%;
        }

        .Hero1 {
            height: 100vh;
            width: 65vw;
            /* background-color: yellow; */
            display: flex;
            flex-direction: column;
        }

        .hero2 {
            margin: 0px;
            padding: 0px;
            height: 100vh;
            width: 35vw;
            background-color: aqua;
        }

        .leftImage {
            height: 100%;
            width: 100%;


        }

        header {
            background-color: white;
            padding: 0px;
            margin: 0px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            height: 20vh;
            width: 65vw;
        }

        .logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10%;
            height: 100%;
            width: 50%;

        }

        .leftLogo {
            height: 100px;
            width: 100px;



        }

        .rightLogo {

            height: 100px;
            width: 100px;
        }


        .linksButtons {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 0px;
            margin: 0px;
            height: 100%;
            width: 500px;


        }

        .LinkList {

            width: 100%;
            margin: 0;
            padding: 0;
        }


        .mainList {
            display: flex;
            justify-content: start;
            align-items: center;
            gap: 85px;
            list-style: none;
            padding: 0px;
            margin: 0px;


        }

        .linkHeader {
            text-decoration: none;
            color: black;
            font-size: 20px;

        }

        .buttonsList {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0px;
            margin: 0px;
            gap: 30px;

        }

        .Button-header {
            width: 400px;
            height: 50px;
            border-radius: 10px;
            color: black;
            border: 2px solid rgb(200, 199, 199);
            background-color: white;
            font-size: 16px;
            font-size: 'Roboto', sans-serif;
            cursor: pointer;

        }

        .Button-header:hover {
            width: 400px;
            height: 50px;
            border-radius: 10px;
            color: white;
            border: 1px solid orange;
            background-color: orange;
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            cursor: pointer;
        }

        .Links {
            height: 100%;
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .login-btn {
            background-color: orange;
            color: white;
            border: 1px solid orange;
        }

        .Section1Part2 {
            height: 30vh;
            width: 100%;
            background-color: white;
            margin: 0px;
            padding: 0px;
        }

        #IndianRailwayHeading {
            margin: 0px;
            padding: 0px;
            height: 50%;
            width: 100%;
            display: flex;
            justify-content: start;
            align-items: center;
            background-color: white;
            font-size: 50px;
            font-weight: bold;
            color: black
        }



        #mainHead {
            padding-left: 150px;
        }

        .IndianRailwaySubHeading {
            height: 50%;
            width: 100%;
            display: flex;
            justify-content: start;
            align-self: flex-start;
            margin: 0px;
            padding: 0px;
            padding-left: 150px;
            gap: 50px;
            align-items: center;
            font-size: 25px;

        }

        #Styleing1 {
            color: green;

        }

        #Styleing2 {
            color: orange;

        }

        #Styleing3 {
            color: rgb(7, 7, 114)
        }

        .Section1Part3 {
            height: 50vh;
            width: 100%;
            /* background-color: blue; */

        }

        .OperationButtonSelction {
            display: flex;
            gap: 50px;
            margin-left: 150px;

        }

        .operation-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            height: 60px;
            width: 250px;
            background-color: white;
            border-radius: 5px;
            border: 1px solid rgb(200, 199, 199);
            font-size: 20px;
            font-family: 'Roboto', sans-serif;
        }

        form {
            background-color: white;
        }
    </style>
</head>

<body>

    <main class="main">
        <section class="Hero1">
            <header>
                <div class="logos">
                    <img src="./Irctc_Logo_Left.png" alt="" class="leftLogo">
                    <img src="./Irctc logi right.png" alt="" class="rightLogo">
                </div>
                <div class="Links">
                    <div class="linksButtons">
                        <div class="LinkList">
                            <ul class="mainList">
                                <li><a href="" class="linkHeader">Ask Disha</a></li>
                                <li><a href="" class="linkHeader">Contact Us</a></li>
                                <li><a href="" class="linkHeader">Alerts</a></li>
                            </ul>
                        </div>

                        <div class="buttonsList">
                            <button class="Button-header login-btn">Login</button>
                            <button class="Button-header">Register</button>
                            <button class="Button-header">Register</button>

                        </div>
                    </div>
                </div>
            </header>

            <div class="Section1Part2">
                <div id="IndianRailwayHeading">
                    <h1 id="mainHead">Indian Railway</h1>
                </div>
                <div class="IndianRailwaySubHeading">
                    <h1 id="Styleing1">Safety </h1>
                    <h1 id="Styleing2">Security </h1>
                    <h1 id="Styleing3">Punctuality</h1>
                </div>
            </div>

            <div class="Section1Part3">
                <form action="#">
                    <div class="OperationButtonSelction">
                        <button class="operation-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="none"
                                viewBox="0 0 24 24" stroke="black" stroke-width="1">
                                <path
                                    d="M3 8a2 2 0 012-2h14a2 2 0 012 2v1a2 2 0 000 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2v-1a2 2 0 000-4V8z" />
                                <line x1="12" y1="6" x2="12" y2="18" stroke="black" stroke-width="2"
                                    stroke-dasharray="1,2" />
                                <line x1="14" y1="10" x2="18" y2="10" stroke="black" stroke-width="1" />
                                <line x1="14" y1="12" x2="18" y2="12" stroke="black" stroke-width="1" />
                                <line x1="14" y1="14" x2="18" y2="14" stroke="black" stroke-width="1" />
                            </svg>
                            Book Tickets</button>
                        <button class="operation-btn"> <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50"
                                viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1" stroke-linecap="round"
                                stroke-linejoin="round">
                                <polyline points="6 12 10 16 18 8" />
                            </svg>
                            PNR Status</button>
                        <button class="operation-btn"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"
                                viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1" stroke-linecap="round"
                                stroke-linejoin="round">
                                <!-- Outer Rounded Square -->
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke="black" fill="none" />

                                <!-- Bars -->
                                <line x1="7" y1="14" x2="7" y2="10" />
                                <line x1="11" y1="14" x2="11" y2="6" />
                                <line x1="15" y1="14" x2="15" y2="12" />
                            </svg>
                            Chart / Vacancy </button>
                    </div>


                </form>
            </div>
        </section>

        <section class="hero2">
            <img src="./Train_Left_Image.png" alt="Indian Railway Image1" class="leftImage">
        </section>

    </main>
</body>

</html>
