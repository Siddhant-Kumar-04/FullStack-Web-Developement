<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f0f0;
            color: #333;
        }



        .main {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: scroll;
            justify-content: flex-start;
            align-items: center;

        }

        .Hero1 {
            height: 100vh;
            width: 65vw;
            background-color: yellow;
            display: inline-flex;
        }

        .hero2 {
            margin: 0px;
            padding: 0px;
            height: 100vh;
            width: 35vw;
            background-color: aqua;
        }

        .leftImage {
            height: 100%;
            width: 35vw;
            overflow: scroll;

        }

        header {
            background-color: white;
            padding: 0px;
            margin: 0px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            height: 20vh;
            width: 65vw;
        }

        .logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10%;
            height: 100%;
            width: 50%;




        }

        .leftLogo {
            height: 100px;
            width: 100px;



        }

        .rightLogo {

            height: 100px;
            width: 100px;
        }


        .linksButtons {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 0px;
            margin: 0px;
            height: 200px;
            width: 500px;


        }

        .LinkList {

            width: 100%;
            margin: 0;
            padding: 0;
        }


        .mainList {
            display: flex;
            justify-content: start;
            align-items: start;
            height: 100%;
            gap: 85px;
            list-style: none;
            padding: 0px;
            margin: 0px;
            height: 100%;
            width: 100%;
            align-content: justify;

        }

        .linkHeader {
            text-decoration: none;
            color: black;
            font-size: 20px;

        }

        .buttonsList {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0px;
            margin: 0px;
            gap: 30px;

        }

        .Button-header {
            width: 400px;
            height: 50px;
            border-radius: 10px;
            color: black;
            border: 2px solid rgb(200, 199, 199);
            background-color: white;
            font-size: 16px;
            font-size: 'Roboto', sans-serif;
            cursor: pointer;

        }

        .Button-header:hover {
            width: 400px;
            height: 50px;
            border-radius: 5px;
            color: white;
            border: 1px solid orange;
            background-color: orange;
            font-size: 16px;
            cursor: pointer;
        }

        .Links {
            height: 100%;
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .login-btn {
            background-color: orange;
            color: white;
            border: 1px solid orange;
        }
    </style>
</head>

<body>

    <main class="main">
        <section class="Hero1">
            <header>
                <div class="logos">
                    <img src="./Irctc_Logo_Left.png" alt="" class="leftLogo">
                    <img src="./Irctc logi right.png" alt="" class="rightLogo">
                </div>
                <div class="Links">
                    <div class="linksButtons">
                        <div class="LinkList">
                            <ul class="mainList">
                                <li><a href="" class="linkHeader">Ask Disha</a></li>
                                <li><a href="" class="linkHeader">Contact Us</a></li>
                                <li><a href="" class="linkHeader">Alerts</a></li>
                            </ul>
                        </div>

                        <div class="buttonsList">
                            <button class="Button-header login-btn">Login</button>
                            <button class="Button-header">Register</button>
                            <button class="Button-header">Register</button>

                        </div>
                    </div>
                </div>
            </header>
        </section>






        <section class="hero2">
            <img src="./Train_Left_Image.png" alt="Indian Railway Image1" class="leftImage">
        </section>

    </main>
</body>

</html>
