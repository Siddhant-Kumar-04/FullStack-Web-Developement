<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
        *{
    margin:0;
    padding: 0;
    outline: 1px solid black;
}
header{
    height:100px;
    display:flex;
    justify-content:end;
    align-items:center;
    background-color: aquamarine;
}
ul{
    height:30px;
    /* padding:0px 20px; */
    list-style-type: none;
    display: flex;
    margin-right: 15px;
}
a{
    display:flex;
    align-items: center;
    justify-content: center;
    height:40%;
    width:60%;
    /* height:40px; */
    text-decoration: none;
    color:black;
    margin:0px 10px;
    background-color: white;
    padding: 5px 10px;
    border-radius: 2px;
    transition: 1s ease;
}
li{
    display:flex;
    align-items: center;
    justify-content: center;
    
}

a:hover{
    background-color: blueviolet;
}

@media screen and (max-width:768px) {

    header{
        display:flex;
        justify-content: center;
        align-items: center;
    }

}
@media  screen and (max-width:570px) {
    header{
        height:190px;
        
    }
    nav{
        display:flex;
        justify-content: flex-start;
        align-items: flex-start;
        height:100%;
        width:100%;
        
    }

     nav ul{
        height:100%;
        width:100%;
        display:flex;
        flex-direction: column;
        justify-content: center;
        /* background-color: blue;; */
        justify-items: center;
        padding: 0px 20px;
        gap:10px;
        margin:0px;
       
    }
   a{
    display: flex;
    align-items: center;
     justify-content: center;
    height:30%;
    width:30%;
    margin:0px 0px;
   }
   ul li{
    width:100%;
    background-color: white;
    
     /* padding:20px 20px; */

   }


    
    /* We will apply a below rules only to those those who has 480px */

}
    </style>
</head>
<body>
    
    <header>
        <nav>
            <ul>
                <li><a href="">Home </a></li>
                <li><a href="">About</a></li>
                <li><a href="">Services</a></li>
                <li><a href="">Contact</a></li>
            </ul>
        </nav>
    </header>

</body>
</html>
